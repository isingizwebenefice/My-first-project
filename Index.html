
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOLAN AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080e19;
    color: #e8f2ff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    height: 70px;
    padding: 15px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #20334b;
}

.logo {
    color: #57baff;
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 2px;
}

.status {
    color: #54db9c;
    font-size: 12px;
}

main {
    max-width: 850px;
    margin: auto;
    padding: 25px 16px;
}

.hero {
    text-align: center;
    padding: 30px 10px;
}

.orb {
    width: 105px;
    height: 105px;
    margin: auto auto 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #65d8ff, #1260ae 55%, #102039);
    box-shadow: 0 0 45px #167bd988;
    animation: pulse 3s infinite;
}

@keyframes pulse {
    50% {
        box-shadow: 0 0 70px #168bffcc;
    }
}

.hero h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.hero p {
    color: #8fa7c2;
}

#chat {
    min-height: 250px;
    max-height: 48vh;
    overflow-y: auto;
    padding: 15px 0;
}

.message {
    padding: 15px;
    margin: 12px 0;
    border-radius: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #153657;
    margin-left: 12%;
}

.assistant {
    background: #142235;
    margin-right: 12%;
}

.input-area {
    display: flex;
    gap: 9px;
    background: #101d2e;
    border: 1px solid #2a4564;
    padding: 10px;
    border-radius: 15px;
}

input {
    flex: 1;
    min-width: 0;
    background: transparent;
    color: white;
    border: none;
    outline: none;
    font-size: 16px;
}

button {
    background: #087ed1;
    color: white;
    border: none;
    padding: 12px 15px;
    border-radius: 10px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

.secondary {
    background: #20354e;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.actions button {
    flex: 1;
}

footer {
    color: #71869f;
    text-align: center;
    font-size: 12px;
    padding: 25px;
}

@media(max-width: 500px) {
    .hero h1 {
        font-size: 25px;
    }

    .user {
        margin-left: 5%;
    }

    .assistant {
        margin-right: 5%;
    }

    button {
        padding: 11px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">NOLAN AI</div>
    <div class="status">● AI INTERFACE</div>
</header>

<main>

    <section class="hero">
        <div class="orb"></div>
        <h1>Hello, I'm Nolan.</h1>
        <p>Your personal AI assistant. How can I help you?</p>
    </section>

    <section id="chat" aria-live="polite">
        <div class="message assistant">
            Hello! I'm Nolan. Ask me anything and let's get started.
        </div>
    </section>

    <section class="input-area">
        <input
            id="userInput"
            type="text"
            placeholder="Ask Nolan something..."
            autocomplete="off"
        >

        <button class="secondary" id="voiceButton"
                onclick="startVoice()">🎤</button>

        <button id="sendButton" onclick="sendMessage()">Send</button>
    </section>

    <section class="actions">
        <button class="secondary" onclick="clearChat()">
            Clear chat
        </button>

        <button class="secondary" onclick="speakLast()">
            🔊 Speak last reply
        </button>
    </section>

</main>

<footer>
    NOLAN AI · Personal Assistant
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");

let messages = JSON.parse(
    localStorage.getItem("nolanMessages") || "[]"
);

let lastReply = "";

function renderMessage(role, content) {
    const div = document.createElement("div");

    div.className = "message " + role;
    div.textContent = content;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
}

// Restore previous conversation
messages.forEach(message => {
    renderMessage(message.role, message.content);
});

async function sendMessage() {
    const text = input.value.trim();

    if (!text || sendButton.disabled) return;

    messages.push({
        role: "user",
        content: text
    });

    renderMessage("user", text);

    input.value = "";
    sendButton.disabled = true;

    const loading = renderMessage(
        "assistant",
        "Nolan is thinking..."
    );

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                messages: messages
            })
        });

        if (!response.ok) {
            throw new Error("Server error: " + response.status);
        }

        const data = await response.json();

        if (data.error) {
            throw new Error(data.error);
        }

        loading.textContent = data.reply;

        messages.push({
            role: "assistant",
            content: data.reply
        });

        lastReply = data.reply;

        // Keep conversation locally
        messages = messages.slice(-20);

        localStorage.setItem(
            "nolanMessages",
            JSON.stringify(messages)
        );

    } catch (error) {
        loading.textContent = "Sorry: " + error.message;
    }

    sendButton.disabled = false;
    input.focus();
}

input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        sendMessage();
    }
});

function clearChat() {
    messages = [];
    lastReply = "";

    localStorage.removeItem("nolanMessages");

    chat.innerHTML = "";

    renderMessage(
        "assistant",
        "Hello again! I'm Nolan. What would you like to discuss?"
    );

    speechSynthesis.cancel();
}

function speakLast() {
    if (!lastReply) return;

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(lastReply);

    speech.lang = "en-US";
    speech.rate = 1;

    speechSynthesis.speak(speech);
}

function startVoice() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Voice recognition is not supported in this browser.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;

    recognition.onresult = event => {
        input.value = event.results[0][0].transcript;
        sendMessage();
    };

    recognition.onerror = () => {
        alert("Voice recognition failed. Please try again.");
    };

    recognition.start();
}
</script>

</body>
</html>
